<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1329" stroke="#2a3a53" stroke-width="1"/>
  <rect x="30" y="15" width="40" height="40" rx="8" fill="url(#cyanBlue)"/>
  <text x="50" y="41" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" text-anchor="middle">QoS</text>
  <text x="85" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20">QoSForge <tspan fill="#06b6d4">Pro</tspan></text>
  <text x="85" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">RFC 2474 / RFC 2697 / RFC 3168 Studio</text>

  <!-- Profile Tag -->
  <rect x="950" y="20" width="220" height="32" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="965" y="41" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Enterprise Campus (VoIP EF)</text>

  <!-- Sidebar (Left) -->
  <rect x="30" y="90" width="340" height="555" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="50" y="125" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">IP Header DiffServ &amp; Token Bucket</text>

  <rect x="50" y="145" width="300" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">DSCP CODEPOINT (6-BIT)</text>
  <text x="65" y="183" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13">EF / Expedited Forwarding (DSCP 46)</text>

  <rect x="50" y="210" width="300" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="230" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ECN FIELD (RFC 3168)</text>
  <text x="65" y="248" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13">CE (11): Congestion Encountered</text>

  <rect x="50" y="275" width="300" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">COMMITTED RATE CIR (KBPS)</text>
  <text x="65" y="313" fill="#06b6d4" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">100,000 kbps (100 Mbps)</text>

  <rect x="50" y="340" width="300" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">COMMITTED BURST BC (BYTES)</text>
  <text x="65" y="378" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">312,500 Bytes (25ms absorption)</text>

  <text x="50" y="425" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Zero-Trust Controls</text>
  <text x="75" y="455" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Enforce Trust Boundary Ingress</text>
  <text x="75" y="485" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Strict Priority Policed (25%)</text>
  <text x="75" y="515" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ WRED Active Queue Management</text>
  <text x="75" y="545" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Explicit Congestion Notification (ECN)</text>
  <text x="75" y="575" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Control Plane Protected (CS6/7)</text>
  <text x="75" y="605" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Egress Traffic Shaping (vs. Drop)</text>

  <!-- Right Dashboard -->
  <!-- 4 KPI Cards -->
  <rect x="390" y="90" width="180" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="405" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">RAW TOS BYTE</text>
  <text x="405" y="142" fill="#06b6d4" font-family="monospace" font-size="22" font-weight="700">0xBB</text>
  <text x="405" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">DSCP 46 + ECN 3</text>

  <rect x="585" y="90" width="180" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="600" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">CLASS &amp; COS</text>
  <text x="600" y="142" fill="#3b82f6" font-family="monospace" font-size="20" font-weight="700">CoS 5 / EF</text>
  <text x="600" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Expedited Fwd</text>

  <rect x="780" y="90" width="180" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="795" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">REFILL PERIOD TC</text>
  <text x="795" y="142" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="700">25.0 ms</text>
  <text x="795" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Committed Interval</text>

  <rect x="975" y="90" width="195" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="990" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ZERO-TRUST AUDIT</text>
  <text x="990" y="142" fill="#10b981" font-family="monospace" font-size="22" font-weight="700">100/100</text>
  <text x="990" y="162" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Grade A+ (Verified)</text>

  <!-- Visualizer & Simulation Table -->
  <rect x="390" y="195" width="780" height="450" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="415" y="230" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Dual Token Bucket (srTCM) &amp; Wireshark Dissector</text>

  <!-- Visual Gauge Mockup -->
  <rect x="420" y="255" width="60" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="420" y="275" width="60" height="80" rx="4" fill="#06b6d4" opacity="0.8"/>
  <text x="450" y="375" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Bucket C (Bc)</text>

  <text x="500" y="310" fill="#334155" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">→</text>

  <rect x="530" y="255" width="60" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="530" y="295" width="60" height="60" rx="4" fill="#f59e0b" opacity="0.8"/>
  <text x="560" y="375" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Bucket E (Be)</text>

  <!-- Wireshark Hex Box -->
  <rect x="620" y="255" width="530" height="120" rx="6" fill="#0d131f" stroke="#2a3a53"/>
  <text x="635" y="280" fill="#38bdf8" font-family="monospace" font-size="11">0000   00 aa bb cc dd ee 00 1a 2b 3c 4d 5e 08 00 45 bb</text>
  <text x="635" y="300" fill="#38bdf8" font-family="monospace" font-size="11">0010   00 28 5a 2b 40 00 40 06 14 37 c0 a8 01 0a 0a 00</text>
  <text x="635" y="320" fill="#38bdf8" font-family="monospace" font-size="11">0020   00 01 13 c4 13 c4 10 00 00 01 00 00 00 00 50 02</text>
  <text x="635" y="340" fill="#38bdf8" font-family="monospace" font-size="11">0030   fa f0 00 00 00 00 00 00 00 00 00 00 55 f3 67 8a</text>
  <text x="635" y="362" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">IP Checksum: 0x1437 [VALID] | CRC32 FCS: 0x55F3678A [VALID]</text>

  <!-- Packet Arrival Simulation Table -->
  <rect x="415" y="405" width="735" height="215" rx="6" fill="#0f172a" stroke="#2a3a53"/>
  <text x="430" y="430" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BURST SIMULATION: PACKET DISPOSITION LOG</text>

  <text x="430" y="460" fill="#f1f5f9" font-family="monospace" font-size="12">#1  0.0ms   1500B   Tc: 311,000B   [GREEN]  Conform  -> Transmit unaltered</text>
  <text x="430" y="490" fill="#f1f5f9" font-family="monospace" font-size="12">#2  0.1ms   1500B   Tc: 309,500B   [GREEN]  Conform  -> Transmit unaltered</text>
  <text x="430" y="520" fill="#f1f5f9" font-family="monospace" font-size="12">#3  0.2ms   1500B   Tc: 308,000B   [GREEN]  Conform  -> Transmit unaltered</text>
  <text x="430" y="550" fill="#f1f5f9" font-family="monospace" font-size="12">#4  0.3ms   1500B   Tc: 306,500B   [GREEN]  Conform  -> Transmit unaltered</text>
  <text x="430" y="580" fill="#f1f5f9" font-family="monospace" font-size="12">#5  0.5ms   1500B   Tc: 307,500B   [GREEN]  Conform  -> Transmit unaltered</text>
  <text x="430" y="605" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Buffer health: 0 packet drops, 0ms queue bufferbloat, ECN marking ready.</text>
</svg>
