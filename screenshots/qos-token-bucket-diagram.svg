<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="diagramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#diagramBg)"/>

  <!-- Title -->
  <text x="500" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">
    IETF RFC 2474 (DiffServ) &amp; RFC 2697 (srTCM) Token Bucket Architecture
  </text>
  <text x="500" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    Packet Classification, Dual Token Bucket Replenishment &amp; Active Queue Management
  </text>

  <!-- 1. IPv4 Header Type of Service (ToS) Byte (Bits 0..7) -->
  <g transform="translate(100, 95)">
    <rect x="0" y="0" width="800" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="24" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      IPv4 Type of Service (ToS) / DiffServ Field (8 Bits)
    </text>

    <!-- DSCP Box (6 bits) -->
    <rect x="20" y="35" width="580" height="35" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="310" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
      DSCP: Differentiated Services Codepoint (Bits 0–5) [e.g. 101110 = EF / 46]
    </text>

    <!-- ECN Box (2 bits) -->
    <rect x="610" y="35" width="170" height="35" rx="4" fill="#047857" stroke="#34d399"/>
    <text x="695" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
      ECN: RFC 3168 (Bits 6–7)
    </text>
  </g>

  <!-- Arrow down -->
  <path d="M 500 185 L 500 220" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Dual Token Bucket System -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="800" height="150" rx="8" fill="#0f172a" stroke="#2a3a53"/>
    <text x="400" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
      RFC 2697 Single-Rate Three-Color Marker (srTCM) Token Flow
    </text>

    <!-- Refill Rate CIR -->
    <rect x="30" y="45" width="180" height="85" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="120" y="70" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">TOKEN REFILL (CIR)</text>
    <text x="120" y="90" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">R = CIR / 8</text>
    <text x="120" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Δtokens = R × Δt</text>

    <text x="235" y="92" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">→</text>

    <!-- Bucket C -->
    <rect x="270" y="45" width="220" height="85" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="380" y="70" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">BUCKET C (Capacity: Bc)</text>
    <text x="380" y="90" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">If Tc >= B → Green</text>
    <text x="380" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Conform: Transmit Unaltered</text>

    <text x="515" y="92" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">→</text>

    <!-- Bucket E -->
    <rect x="550" y="45" width="220" height="85" rx="6" fill="#1e293b" stroke="#f59e0b"/>
    <text x="660" y="70" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">BUCKET E (Capacity: Be)</text>
    <text x="660" y="90" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">If Te >= B → Yellow</text>
    <text x="660" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Exceed: Re-mark / Transmit</text>
  </g>

  <!-- 3. Active Queue Management (WRED / ECN) -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="800" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="400" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      Active Queue Management: WRED Drop Curve &amp; RFC 3168 ECN Congestion Marking
    </text>

    <rect x="30" y="45" width="220" height="55" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="140" y="68" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">GREEN ZONE (Queue &lt; Min_Th)</text>
    <text x="140" y="85" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">0% Drop Rate (No Congestion)</text>

    <rect x="280" y="45" width="240" height="55" rx="4" fill="#0f172a" stroke="#f59e0b"/>
    <text x="400" y="68" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">YELLOW ZONE (Min_Th &lt;= Q &lt; Max_Th)</text>
    <text x="400" y="85" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Remark to ECN CE (11) (No Packet Drop)</text>

    <rect x="550" y="45" width="220" height="55" rx="4" fill="#0f172a" stroke="#ef4444"/>
    <text x="660" y="68" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">RED ZONE (Queue &gt;= Max_Th)</text>
    <text x="660" y="85" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">100% Tail Drop (Buffer Exhausted)</text>
  </g>
</svg>
